<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>很高兴认识你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #ff6b6b;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        .subtitle {
            color: #555;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .heart {
            color: #ff6b6b;
            font-size: 2rem;
            margin: 0 5px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .input-group {
            margin: 30px 0;
        }

        input {
            padding: 12px 20px;
            border: 2px solid #ffc3a0;
            border-radius: 50px;
            font-size: 1.1rem;
            width: 70%;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }

        button {
            background: linear-gradient(to right, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .message {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(255, 235, 235, 0.7);
            border-radius: 15px;
            display: none;
            animation: fadeIn 1s;
        }

        .message h2 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .message p {
            color: #555;
            line-height: 1.6;
        }

        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart-shape {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff6b6b;
            transform: rotate(45deg);
            opacity: 0.7;
            animation: floatUp 10s linear infinite;
        }

        .heart-shape:before,
        .heart-shape:after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff6b6b;
            border-radius: 50%;
        }

        .heart-shape:before {
            top: -10px;
            left: 0;
        }

        .heart-shape:after {
            top: 0;
            left: -10px;
        }

        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .music-control i {
            font-size: 24px;
            color: #ff6b6b;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            input {
                width: 90%;
            }
        }
    </style>
</head>
<body>
<div class="floating-hearts" id="hearts-container"></div>

<div class="container">
    <h1>很高兴认识你 <span class="heart">❤</span></h1>
    <p class="subtitle">每一次相遇都是美好的缘分</p>

    <div class="input-group">
        <input type="text" id="nameInput" placeholder="请输入你的名字...">
        <button id="greetBtn">打个招呼</button>
    </div>

    <div class="message" id="message">
        <h2 id="greetingText"></h2>
        <p>很高兴认识你，希望能带给你欢声笑语，你是一个喜欢运动喜欢读书且自律的人，希望以后互相学习互相进步</p>
        <p>愿你的每一天都充满阳光和欢笑！</p>
    </div>
</div>

<div class="music-control" id="musicControl">
    <i>♪</i>
</div>

<audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-gently-into-the-dawn-747.mp3" type="audio/mpeg">
</audio>

<script>
    // 创建漂浮的心形
    function createHearts() {
        const container = document.getElementById('hearts-container');
        const heartCount = 15;

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-shape';

            // 随机位置和大小
            const size = Math.random() * 20 + 10;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            heart.style.animationDuration = `${Math.random() * 10 + 10}s`;
            heart.style.animationDelay = `${Math.random() * 5}s`;

            // 随机颜色
            const colors = ['#ff6b6b', '#ff8e8e', '#ffafbd', '#ffc3a0'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.backgroundColor = color;

            container.appendChild(heart);
        }
    }

    // 问候功能
    document.getElementById('greetBtn').addEventListener('click', function() {
        const name = document.getElementById('nameInput').value.trim();
        const messageDiv = document.getElementById('message');
        const greetingText = document.getElementById('greetingText');

        if (name) {
            greetingText.textContent = `你好，${name}！很高兴认识你！`;
        } else {
            greetingText.textContent = '你好，朋友！很高兴认识你！';
        }

        messageDiv.style.display = 'block';

        // 添加一些庆祝效果
        for (let i = 0; i < 10; i++) {
            setTimeout(() => {
                createFloatingHeart();
            }, i * 200);
        }
    });

    // 创建庆祝心形
    function createFloatingHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤';
        heart.style.position = 'fixed';
        heart.style.fontSize = `${Math.random() * 30 + 20}px`;
        heart.style.color = '#ff6b6b';
        heart.style.left = `${Math.random() * 100}vw`;
        heart.style.top = '100vh';
        heart.style.opacity = '1';
        heart.style.zIndex = '5';
        heart.style.pointerEvents = 'none';
        heart.style.transition = 'all 1s ease-out';

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.style.transform = 'translateY(-100vh)';
            heart.style.opacity = '0';
        }, 10);

        setTimeout(() => {
            document.body.removeChild(heart);
        }, 2000);
    }

    // 背景音乐控制
    const musicControl = document.getElementById('musicControl');
    const bgMusic = document.getElementById('bgMusic');
    let musicPlaying = false;

    musicControl.addEventListener('click', function() {
        if (musicPlaying) {
            bgMusic.pause();
            musicControl.innerHTML = '<i>♪</i>';
        } else {
            bgMusic.play();
            musicControl.innerHTML = '<i>❚❚</i>';
        }
        musicPlaying = !musicPlaying;
    });

    // 初始化
    window.onload = function() {
        createHearts();

        // 自动播放音乐（需要用户交互，所以先暂停）
        bgMusic.pause();
    };
</script>
</body>
</html>
